version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
        update-types:
          - "minor"
          - "patch"
          - "major"

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
